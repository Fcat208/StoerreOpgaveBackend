name: Deploy Backend to Azure

on:
  push:
    branches: [ master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore StoerreOpgaveBackend.sln

      - name: Build
        run: dotnet build StoerreOpgaveBackend.sln --no-restore -c Release

      - name: Test
        run: dotnet test Repotest/Repotest.csproj --no-build -c Release

      - name: Publish
        run: dotnet publish StoerreOpgaveBackend/StoerreOpgaveBackend.csproj -c Release -o ./publish

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: ./publish
