name: Deploy Backend to Azure

on:
  push:
    branches: [ master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore StoerreOpgaveBackend.sln

      - name: Build
        run: dotnet build StoerreOpgaveBackend.sln --no-restore -c Release

      - name: Test
        run: dotnet test Repotest/Repotest.csproj --no-build -c Release

      - name: Publish
        run: dotnet publish StoerreOpgaveBackend/StoerreOpgaveBackend.csproj -c Release -o ./publish

      - name: Zip publish output
        run: cd publish && zip -r ../publish.zip .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure App Service
        run: az webapp deploy --name ${{ secrets.AZURE_APP_NAME }} --resource-group DrMusicRG --src-path publish.zip --type zip
